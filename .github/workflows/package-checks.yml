name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Verify distributed file integrity
        run: python3 scripts/verify_package.py
      - name: Check documentation and result metadata
        run: python3 scripts/check_documentation.py
      - name: Build and verify release archive
        run: python3 scripts/build_release.py
